<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | EraaSoft</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

 <script src="../js/index.js" defer></script>
<script src="../js/products.js" defer></script>
</head>
<body class="cart-page">
  <nav class="navbar bg-white shadow-sm">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-bold fs-2 text-info">
        EraaSoft
      </a>
    </div>
  </nav>

  <main class="container py-5">
    <a href="index.html" class="back-link d-inline-block mb-4">
      ← Back to products
    </a>

    <p id="product-message" role="status" hidden>Product not found.</p>

    <article id="product-details" class="product-details" hidden>
      <img id="product-image" class="product-image" alt="">

      <div class="product-info">
        <h1 id="product-title"></h1>
        <p id="product-description"></p>
        <p id="product-price" class="product-price"></p>
      </div>
    </article>
  </main>
</body>
</html>
